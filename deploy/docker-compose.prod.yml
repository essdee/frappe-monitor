# Production compose: VictoriaMetrics + Loki for the frappe-monitor stack.
#
# Brought up by the systemd unit frappe-monitor-stack.service so it
# restarts cleanly on reboot. Both services bind to 127.0.0.1 only —
# the monitor binary reaches them on the loopback, and external access
# (if needed at all) is via Caddy on the same host. Do not expose
# 8428/3100 publicly.
#
# Volumes are named so docker volume rm wipes the data deliberately.
# Retention policies live here; tune them per host capacity.

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.142.0
    container_name: frappe-monitor-vm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    command:
      - "--storageDataPath=/data"
      - "--retentionPeriod=90d"
      - "--httpListenAddr=:8428"
      # See deploy/docker-compose.dev.yml for why this flag is load-bearing.
      - "-influxSkipSingleField"
      # Default 30s offset on instant queries adds dashboard latency.
      # The collector is the only writer and pushes complete cycles, so
      # late samples aren't a concern for us.
      - "-search.latencyOffset=0s"
      # Tell VM not to use more than 40% of CONTAINER memory (we cap the
      # container itself below); under that ceiling it self-throttles.
      - "-memory.allowedPercent=40"
    volumes:
      - vm-data:/data
    # Hard caps so the metrics tier can never starve the host. Tuned
    # for a small fleet (≤25 servers): ~50–100 MB steady, with room
    # for the in-memory index. Bump if the dashboard "Sites" page
    # ever times out under load.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  loki:
    image: grafana/loki:3.4.1
    container_name: frappe-monitor-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    # Use our config (enables compactor + 90d retention); the image default has
    # none, so log disk would grow unbounded with the streamer on.
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - loki-data:/loki
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
    # Loki is the lighter of the two; its working set is mostly
    # write-side. 256 MB is generous for our log volume.
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  vm-data:
    name: frappe-monitor-vm-data
  loki-data:
    name: frappe-monitor-loki-data
