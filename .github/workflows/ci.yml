name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check shell and Compose configuration
        shell: bash
        run: |
          bash -n deploy/install.sh deploy/diagnose.sh deploy/local-test.sh \
            scripts/frappe-monitor-collect.sh \
            scripts/frappe-monitor-stream.sh \
            scripts/frappe-monitor-discover-logs.sh \
            scripts/smoke.sh
          (cd deploy && docker compose --project-name frappe-monitor-ci \
            -f - config --quiet < docker-compose.dev.yml)
          (cd deploy && docker compose --project-name frappe-monitor-ci \
            -f - config --quiet < docker-compose.prod.yml)

      - name: Test and build web console
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Test backend with race detector
        run: go test ./... -race -count=1

      - name: Vet and build release binary
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -tags=embed_dist -ldflags="-s -w" \
            -o /tmp/frappe-monitor ./cmd/monitor
